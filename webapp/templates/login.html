{% extends "base.html" %}
{% block titulo %}Ingresar · alerta.pe{% endblock %}
{% block contenido %}
<div class="login-wrap">
  <div class="tarjeta login-card">
    <div class="login-marca">
      <span class="marca-punto"></span>
      <h1 class="titulo-pagina">alerta.pe</h1>
    </div>
    <p class="subtitulo">Tu Buzón SUNAT, las 24 horas.</p>

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="post" action="/login" autocomplete="off">
      <div class="campo">
        <label for="dni">WhatsApp o DNI</label>
        <input id="dni" name="dni" type="text" inputmode="numeric"
          pattern="[0-9]{8,12}" maxlength="12" autocomplete="off"
          required placeholder="Tu WhatsApp (51XXXXXXXXX) o DNI">
        <small class="muted">Usamos tu WhatsApp como acceso porque nadie lo olvida.</small>
      </div>
      <div class="campo">
        <label for="clave">Clave</label>
        <input id="clave" name="clave" type="password"
               autocomplete="current-password" required
               placeholder="Tu clave (inicial = últimos 6 dígitos de tu WhatsApp)">
      </div>
      <button class="btn btn--bloque" type="submit">Ingresar</button>
    </form>

    <p class="muted mt" style="text-align:center;">
      ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>.
    </p>
  </div>
</div>
{% endblock %}
